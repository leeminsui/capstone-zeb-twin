<title>공학 2호관 P2H-EMS 트윈</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<style>
/* Layout: 3D stage fills the frame. Chapter rail top-left, engine pipeline top-centre,
   readouts right, scrub rail pinned low. Each chapter hides what it does not need. */
:root{
  --bg:#e8eaee; --slab:rgba(255,255,255,.90); --line:rgba(22,30,42,.16);
  --fg:#141a24; --muted:#5b6673;
  --pv:#0b7a57; --grid-c:#9d5a12; --cool:#1f6fb5; --heat:#b4452f; --warn:#a62f26;
  --font-ui:"IBM Plex Sans KR",system-ui,sans-serif;
  --font-num:"IBM Plex Mono",ui-monospace,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --bg:#0b0f14; --slab:rgba(13,19,27,.88); --line:rgba(176,196,220,.20);
  --fg:#e8eef6; --muted:#8e9bab;
  --pv:#3ddba4; --grid-c:#f0ad53; --cool:#64b5f0; --heat:#ff8a6e; --warn:#ff7265;
  color-scheme:dark; } }
:root[data-theme="dark"]{
  --bg:#0b0f14; --slab:rgba(13,19,27,.88); --line:rgba(176,196,220,.20);
  --fg:#e8eef6; --muted:#8e9bab;
  --pv:#3ddba4; --grid-c:#f0ad53; --cool:#64b5f0; --heat:#ff8a6e; --warn:#ff7265;
  color-scheme:dark; }

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font-ui);overflow:hidden}
#app{position:relative;height:100%;overflow:hidden}
#sky{position:absolute;inset:0;transition:background .9s linear}
#scene{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#scene.drag{cursor:grabbing}
#room{position:absolute;inset:0;width:100%;height:100%;display:block;
      opacity:0;transform:scale(1.14);pointer-events:none;
      transition:opacity .5s ease,transform .7s cubic-bezier(.16,.8,.3,1)}
body[data-ch="2"] #room{opacity:1;transform:scale(1)}
#results{position:absolute;inset:0;width:100%;height:100%;display:block;
      opacity:0;transform:scale(1.06);pointer-events:none;
      transition:opacity .45s ease,transform .6s cubic-bezier(.16,.8,.3,1)}
body[data-ch="4"] #results{opacity:1;transform:scale(1)}
#scene,#sky{transition:opacity .5s ease,transform .7s cubic-bezier(.16,.8,.3,1)}
body[data-ch="2"] #scene,body[data-ch="2"] #sky{opacity:0;transform:scale(.90)}
body[data-ch="4"] #scene,body[data-ch="4"] #sky{opacity:0;transform:scale(.94)}
body[data-ch="4"] #metrics,body[data-ch="4"] #engine,body[data-ch="4"] #clock{opacity:0;pointer-events:none}
#metrics,#engine,#clock{transition:opacity .35s ease}
.num{font-family:var(--font-num);font-variant-numeric:tabular-nums}
.eyebrow{font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600}
.slab{background:var(--slab);border:1px solid var(--line);border-radius:5px;
      backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}

/* ---- chapters + clock ---- */
#topleft{position:absolute;top:max(12px,env(safe-area-inset-top,0px));
         left:max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:9px}
#chapters{display:flex;gap:0;overflow:hidden;width:max-content}
#chapters button{border-radius:0;border-right-width:0;padding:6px 11px}
#chapters button:first-child{border-radius:4px 0 0 4px}
#chapters button:last-child{border-radius:0 4px 4px 0;border-right-width:1px}
#clock{pointer-events:none;padding:7px 12px 9px;width:max-content}
#date{font-size:11.5px;color:var(--muted);letter-spacing:.04em}
#time{font-size:36px;font-weight:700;line-height:1.04;letter-spacing:-.01em}
#site{font-size:10.5px;color:var(--muted);margin-top:1px}
#wx{font-size:10.5px;color:var(--fg);margin-top:3px;font-weight:500}

/* ---- engine pipeline ---- */
#engine{position:absolute;top:max(12px,env(safe-area-inset-top,0px));left:50%;
        transform:translateX(-50%);padding:8px 11px 9px;max-width:min(520px,calc(100% - 32px))}
#engHead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:7px}
#tick{font-size:10px;color:var(--muted)}
#stages{display:flex;align-items:stretch;gap:0}
.stage{flex:1 1 0;min-width:0;display:flex;flex-direction:column;gap:3px;
       padding:0 7px;border-left:2px solid var(--line);opacity:.42;transition:opacity .25s}
.stage:first-child{border-left-width:0;padding-left:0}
.stage.on{opacity:1;border-left-color:var(--pv)}
.stage .t{font-size:10.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stage .d{font-size:9px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#engBar{height:2px;background:var(--line);margin-top:7px;border-radius:1px;overflow:hidden}
#engBar i{display:block;height:100%;background:var(--pv);width:0}

/* ---- readouts ---- */
#metrics{position:absolute;top:calc(max(12px,env(safe-area-inset-top,0px)) + 104px);
         right:max(16px,env(safe-area-inset-right,0px));width:206px;
         display:flex;flex-direction:column;
         background:var(--slab);border:1px solid var(--line);border-radius:5px;
         backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.m{display:flex;flex-direction:column;gap:1px;padding:7px 11px;border-bottom:1px solid var(--line)}
.m:last-child{border-bottom:0}
.m .v{font-size:20px;font-weight:600;line-height:1.1}
.m .v .u{font-size:10px;color:var(--muted);font-weight:400;margin-left:2px}
.m .sub{font-size:9.5px;color:var(--muted)}
.m.pv .v{color:var(--pv)} .m.gi .v{color:var(--grid-c)} .m.cl .v{color:var(--cool)}
#band{position:relative;height:5px;border-radius:3px;background:var(--line);margin-top:4px;overflow:hidden}
#bandOk{position:absolute;top:0;bottom:0;background:color-mix(in srgb,var(--pv) 42%,transparent)}
#bandDot{position:absolute;top:-2px;width:2px;height:9px;background:var(--fg);border-radius:1px}

/* ---- forecast card ---- */
#fcPanel{position:absolute;left:max(16px,env(safe-area-inset-left,0px));
        bottom:calc(106px + env(safe-area-inset-bottom,0px));
        width:min(620px,calc(100% - 260px));padding:10px 13px 11px;display:none}
body[data-ch="1"] #fcPanel{display:block}
#fcHead{display:flex;justify-content:space-between;align-items:baseline;gap:14px;flex-wrap:wrap}
#fcNums{display:flex;gap:14px;align-items:baseline}
#fcNums span{font-size:10.5px;color:var(--muted)}
#fcNums b{font-family:var(--font-num);font-size:15px;font-weight:600;margin-left:4px}
#fcChart{width:100%;height:188px;display:block;margin-top:4px}
#fcNote{font-size:10px;color:var(--muted);margin-top:4px;line-height:1.45}

/* ---- 3D labels ---- */
#overlay{position:absolute;inset:0;pointer-events:none}
.tag{position:absolute;transform:translate(-50%,-50%);font-family:var(--font-num);
     font-size:10px;font-weight:500;background:var(--slab);color:var(--fg);
     border:1px solid var(--line);border-radius:3px;padding:2px 6px;white-space:nowrap;
     box-shadow:0 1px 8px rgba(0,0,0,.2)}
.tag.cool{border-color:var(--cool);color:var(--cool)}
.tag.pvt{border-color:var(--pv);color:var(--pv)}

/* ---- scrub rail ---- */
#rail{position:absolute;left:0;right:0;bottom:env(safe-area-inset-bottom,0px);
      background:var(--slab);border-top:1px solid var(--line);
      backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
      padding-left:max(16px,env(safe-area-inset-left,0px));
      padding-right:max(16px,env(safe-area-inset-right,0px));
      padding-block:8px 9px;display:flex;flex-direction:column;gap:6px}
#track{width:100%;height:50px;display:block;cursor:pointer;touch-action:none}
#bar{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
button{font-family:var(--font-ui);font-size:11.5px;font-weight:500;color:var(--fg);
       background:var(--slab);border:1px solid var(--line);border-radius:3px;
       padding:5px 10px;cursor:pointer}
button:hover{border-color:var(--muted)}
button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
button:focus-visible{outline:2px solid var(--pv);outline-offset:2px}
#play{min-width:62px;font-weight:600}
.spacer{flex:1 1 auto;min-width:0}
#legend{display:flex;gap:11px;font-size:9.5px;color:var(--muted);align-items:center}
#legend i{display:inline-block;width:9px;height:3px;border-radius:2px;margin-right:4px;vertical-align:middle}

/* chapter visibility */
body[data-ch="1"] #metrics .m.hide1{display:none}

@media (max-width:900px){
  #engine{display:none} #legend{display:none}
  body[data-ch="1"] #fcPanel{display:none}
  #metrics{width:142px;top:calc(max(12px,env(safe-area-inset-top,0px)) + 112px)}
  .m .v{font-size:16px} #time{font-size:28px}
}
</style>

<div id="app">
  <div id="sky"></div>
  <canvas id="scene"></canvas>
  <canvas id="room"></canvas>
  <canvas id="results"></canvas>
  <div id="overlay"></div>

  <div id="topleft">
    <div id="chapters">
      <button data-ch="1" type="button" aria-pressed="true">1 · 예측</button>
      <button data-ch="2" type="button">2 · 제어</button>
      <button data-ch="3" type="button">3 · 종합</button>
      <button data-ch="4" type="button">4 · 결과</button>
    </div>
    <div id="clock" class="slab">
      <div id="date" class="num">—</div>
      <div id="time" class="num">—</div>
      <div id="site">충남대 공학 2호관 · P2H-EMS</div>
      <div id="wx">—</div>
    </div>
  </div>

  <div id="engine" class="slab">
    <div id="engHead">
      <span class="eyebrow">15분 제어 주기</span>
      <span id="tick" class="num">—</span>
    </div>
    <div id="stages">
      <div class="stage" data-s="0"><div class="t">기상 수집</div><div class="d">Solcast 15분</div></div>
      <div class="stage" data-s="1"><div class="t">PV 예측</div><div class="d">Transformer 6h</div></div>
      <div class="stage" data-s="2"><div class="t">MPC 최적화</div><div class="d">Gurobi · horizon</div></div>
      <div class="stage" data-s="3"><div class="t">첫 입력 적용</div><div class="d">receding</div></div>
      <div class="stage" data-s="4"><div class="t">EHP 운전</div><div class="d">공급온도 제어</div></div>
    </div>
    <div id="engBar"><i></i></div>
  </div>

  <div id="metrics">
    <div class="m pv">
      <div class="eyebrow">태양광 발전</div>
      <div class="v num" id="mPv">—<span class="u">kW</span></div>
      <div class="sub" id="mPvSub">—</div>
    </div>
    <div class="m hide1">
      <div class="eyebrow">건물 부하</div>
      <div class="v num" id="mLd">—<span class="u">kW</span></div>
      <div class="sub" id="mLdSub">—</div>
    </div>
    <div class="m gi hide1">
      <div class="eyebrow">계통 수전</div>
      <div class="v num" id="mGi">—<span class="u">kW</span></div>
      <div class="sub" id="mGiSub">—</div>
    </div>
    <div class="m cl">
      <div class="eyebrow">EHP 냉방</div>
      <div class="v num" id="mPc">—<span class="u">kW</span></div>
      <div class="sub" id="mPcSub">—</div>
    </div>
    <div class="m">
      <div class="eyebrow">실내 / 외기</div>
      <div class="v num" id="mRt">—<span class="u">°C</span></div>
      <div class="sub" id="mRtSub">—</div>
      <div id="band"><div id="bandOk"></div><div id="bandDot"></div></div>
    </div>
    <div class="m hide1">
      <div class="eyebrow">누적 전기요금</div>
      <div class="v num" id="mCost">—<span class="u">원</span></div>
      <div class="sub" id="mCostSub">—</div>
    </div>
  </div>

  <div id="fcPanel" class="slab">
    <div id="fcHead">
      <span class="eyebrow">대전 패널 발전량 (W) · 6시간 선행 예측</span>
      <span id="fcNums">
        <span style="color:var(--pv)">예측<b id="fcV">—</b></span>
        <span>실측<b id="msV">—</b></span>
      </span>
    </div>
    <canvas id="fcChart"></canvas>
    <div id="fcNote">—</div>
  </div>

  <div id="rail">
    <canvas id="track"></canvas>
    <div id="bar">
      <button id="play" type="button">일시정지</button>
      <button class="sp" data-rate="15" type="button">15분/s</button>
      <button class="sp" data-rate="60" type="button" aria-pressed="true">1h/s</button>
      <button class="sp" data-rate="240" type="button">4h/s</button>
      <button class="sp" data-rate="720" type="button">12h/s</button>
      <div class="spacer"></div>
      <div id="legend">
        <span><i style="background:var(--pv)"></i>발전</span>
        <span><i style="background:var(--grid-c)"></i>수전</span>
        <span><i style="background:var(--cool)"></i>냉방</span>
      </div>
    </div>
  </div>
</div>

<script src="data/zeb_window.js"></script>
<script>
(function(){
"use strict";
const D = window.ZEB_DATA, N = D.n, STEP = D.step_min, HZ = D.hz_len || 24;
const T0 = new Date(D.start + "+09:00");
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;

function fill(a){
  let p=null; for(let i=0;i<a.length;i++){ if(a[i]==null) a[i]=p; else p=a[i]; }
  p=null; for(let i=a.length-1;i>=0;i--){ if(a[i]==null) a[i]=p; else p=a[i]; }
  for(let i=0;i<a.length;i++) if(a[i]==null) a[i]=0;
  return a;
}
["rt","oat","pc","ph","ld","gi","pvs","cur","pr","cost","cl","ch","fc","meas","ghi","ptemp","cc","at","sghi"].forEach(k=>fill(D[k]));
const MX = k => D[k].reduce((a,b)=>Math.max(a,b||0),0);
const PV_MAX=MX("pvs"), GI_MAX=MX("gi"), PC_MAX=MX("pc");
const PANEL_MAX = Math.max(MX("fc"), MX("meas"));
const HZ_MAX = D.hz.reduce((a,r)=>Math.max(a, r.reduce((x,y)=>Math.max(x,y),0)),0)/10 || 1;
const COST=(()=>{const c=[];let s=0;for(let i=0;i<N;i++){s+=D.cost[i]/4;c.push(s);}return c;})();

const S={};
function sample(x){
  const i=Math.max(0,Math.min(N-1,Math.floor(x))), j=Math.min(N-1,i+1), f=x-i;
  const L=k=>D[k][i]+(D[k][j]-D[k][i])*f;
  S.rt=L("rt");S.oat=L("oat");S.pc=L("pc");S.ph=L("ph");S.ld=L("ld");S.gi=L("gi");
  S.pv=L("pvs");S.cur=L("cur");S.pr=L("pr");S.cl=L("cl");S.ch=L("ch");
  S.fc=L("fc");S.meas=L("meas");S.ghi=L("ghi");
  S.cc=L("cc");S.at=L("at");S.sghi=L("sghi");
  S.mode=D.mode[i];S.cost=COST[i];S.rtm=D.rtm[i];S.i=i;S.frac=f;
  S.date=new Date(T0.getTime()+x*STEP*60000);
}

// ================= scene =================
const cv=document.getElementById("scene"), app=document.getElementById("app");
const renderer=new THREE.WebGLRenderer({canvas:cv,antialias:true,alpha:true});
renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));
renderer.outputEncoding=THREE.sRGBEncoding;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=0.70;
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(38,1,0.1,600);
const hemi=new THREE.HemisphereLight(0xdbe6f2,0x40484a,.7); scene.add(hemi);
const sun=new THREE.DirectionalLight(0xfff0d8,1.0); scene.add(sun);
sun.castShadow=true; sun.shadow.mapSize.set(2048,2048);
Object.assign(sun.shadow.camera,{left:-70,right:70,top:70,bottom:-70,near:1,far:220});
sun.shadow.bias=-0.0012; sun.shadow.normalBias=0.4;
const fillL=new THREE.DirectionalLight(0x9fc0e8,.25); fillL.position.set(-20,12,-16); scene.add(fillL);
const world=new THREE.Group(); scene.add(world);
function shade(m){ m.castShadow=true; m.receiveShadow=true; return m; }
const edgeMats=[];
function edges(geo,parent,op){
  const m=new THREE.LineBasicMaterial({color:0x1b2430,transparent:true,opacity:op||.3});
  edgeMats.push(m); parent.add(new THREE.LineSegments(new THREE.EdgesGeometry(geo),m));
}

// --- façade texture: cream wall with the horizontal window bands of the real block ---
function facade(floors, bays, wall, band, mull){
  wall=wall||"#e9e5df"; band=band||"#d7d2ca"; mull=mull||"#cfcac2";
  const c=document.createElement("canvas"); c.width=bays*34; c.height=floors*64;
  const g=c.getContext("2d");
  g.fillStyle=wall; g.fillRect(0,0,c.width,c.height);
  for(let f=0;f<floors;f++){
    const y=f*64;
    g.fillStyle=band; g.fillRect(0,y+54,c.width,10);             // spandrel
    for(let b=0;b<bays;b++){
      const x=b*34+5;
      g.fillStyle="#3d4a59"; g.fillRect(x,y+16,24,32);           // glass
      g.fillStyle=mull; g.fillRect(x+11,y+16,2,32);              // mullion
    }
  }
  const t=new THREE.CanvasTexture(c);
  t.anisotropy=4; return t;
}
const FLOORS=4, FH=3.2, BASE=0.5, HTOP=BASE+FLOORS*FH;
const texLong=facade(FLOORS,14), texShort=facade(FLOORS,4);

function wing(w,d,cx,cz,open){
  const g=new THREE.BoxGeometry(w,FLOORS*FH,d);
  const sideX=facade(FLOORS,Math.max(2,Math.round(d/2.6)));
  const sideZ=facade(FLOORS,Math.max(2,Math.round(w/2.6)));
  const mats=[sideX,sideX,null,null,sideZ,sideZ].map((t,i)=>
    t ? new THREE.MeshStandardMaterial({map:t,roughness:.9})
      : new THREE.MeshStandardMaterial({color:i===2?0xbfc4c9:0x9aa0a6,roughness:.95}));
  if(open!=null){                     // 한 면을 떼어내고 안쪽 벽이 보이도록 양면 렌더
    mats.forEach(m=>{ m.side=THREE.DoubleSide; });
    mats[open].visible=false;
  }
  const m=shade(new THREE.Mesh(g,mats));
  m.position.set(cx,BASE+FLOORS*FH/2,cz);
  edges(g,m,.22); world.add(m);
  // parapet
  const pg=new THREE.BoxGeometry(w+.4,.5,d+.4);
  const p=new THREE.Mesh(pg,new THREE.MeshStandardMaterial({color:0xcdd1d6,roughness:.9}));
  p.position.set(cx,HTOP+.25,cz); edges(pg,p,.22); world.add(p);
  return m;
}

// ㄷ-shaped block around a courtyard, open toward the camera (+Z)
const WB=7.5;                                   // wing depth
wing(40,WB, 0,-16);                             // back wing
wing(WB,34, -16.25, 1);                         // left wing
wing(WB,34,  16.25, 1, 1);                      // right wing — 중정 쪽(-x) 개방

// --- E2 entrance tower (dark brown, at the right wing's open end) ---
(function(){
  const g=new THREE.BoxGeometry(9,FLOORS*FH+1.6,9);
  const brick=()=>new THREE.MeshStandardMaterial({color:0x5a4635,roughness:.95});
  const win=s=>new THREE.MeshStandardMaterial({map:facade(FLOORS,s,"#5a4635","#4a3929","#6d5844"),roughness:.92});
  //            +x      -x(중정)  +y       -y       +z(정면)  -z
  const mats=[brick(), win(3),   brick(), brick(), win(3),  brick()];
  const m=new THREE.Mesh(g,mats);
  m.position.set(16.25,BASE+(FLOORS*FH+1.6)/2,17.5); edges(g,m,.3); world.add(m);
  // pale stair-core stripe facing the courtyard
  const sg=new THREE.BoxGeometry(4.6,FLOORS*FH,0.4);
  const s=new THREE.Mesh(sg,new THREE.MeshStandardMaterial({map:facade(FLOORS,2),roughness:.9}));
  s.position.set(16.25,BASE+FLOORS*FH/2,13.1); world.add(s);
  // "E2" plate
  const c=document.createElement("canvas"); c.width=128; c.height=64;
  const x=c.getContext("2d");
  x.fillStyle="#4e3b2c"; x.fillRect(0,0,128,64);
  x.fillStyle="#f2efe9"; x.font="bold 42px sans-serif"; x.textAlign="center";
  x.textBaseline="middle"; x.fillText("E2",64,34);
  const pl=new THREE.Mesh(new THREE.PlaneGeometry(3.4,1.7),
            new THREE.MeshBasicMaterial({map:new THREE.CanvasTexture(c)}));
  pl.position.set(16.25,HTOP-0.6,13.35); world.add(pl);
})();

// --- ground + courtyard ---

function flow(curve,color,count){
  const geo=new THREE.BufferGeometry();
  geo.setAttribute("position",new THREE.BufferAttribute(new Float32Array(count*3),3));
  const mat=new THREE.PointsMaterial({color,size:.5,transparent:true,opacity:.9,depthWrite:false});

  return {curve,geo,mat,count,t:new Float32Array(count).map((_,i)=>i/count)};
}

  new THREE.Vector3(-23,6,4), new THREE.Vector3(-17,1.4,6)]),0x2fd79b,44);

  new THREE.Vector3(24,4,-14), new THREE.Vector3(18,1.4,-14)]),0xf0a94e,44);
const vT=new THREE.Vector3();
function stepFlow(fl,frac,dt){
  const p=fl.geo.attributes.position.array;
  const sp=(0.00016+frac*0.00070)*dt;
  for(let k=0;k<fl.count;k++){
    let u=(fl.t[k]+sp)%1; if(!(u>=0)) u=0; fl.t[k]=u;
    fl.curve.getPoint(u,vT);
    p[k*3]=vT.x;p[k*3+1]=vT.y;p[k*3+2]=vT.z;
  }
  fl.geo.attributes.position.needsUpdate=true;
  fl.mat.opacity=frac<.004?0:Math.min(.95,.22+frac*1.3);
  fl.mat.size=0.3+frac*0.45;
}

function placeCam(dt){
  const k=Math.min(1,dt*0.0032);
  th+=(tgt.th-th)*k; ph+=(tgt.ph-ph)*k; rad+=(tgt.r-rad)*k;
  look.x+=(tgt.tx-look.x)*k; look.y+=(tgt.ty-look.y)*k; look.z+=(tgt.tz-look.z)*k;
  const nf=tgt.fov||38;
  if(Math.abs(fov-nf)>.05){ fov+=(nf-fov)*k; camera.fov=fov; camera.updateProjectionMatrix(); }
  camera.position.set(look.x + rad*Math.sin(ph)*Math.sin(th),
                      look.y + rad*Math.cos(ph),
                      look.z + rad*Math.sin(ph)*Math.cos(th));
  camera.lookAt(look);
}

  [8,"#6f8fb8","#bcd3e6"],[12,"#5b8fc9","#cfe2f2"],[16.5,"#6b93c4","#d9d2c6"],
  [18,"#4a5878","#d08a5c"],[19.5,"#1e2740","#4a4260"],[24,"#070b14","#101a2b"]];
function mix(a,b,t){const p=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16));
  const A=p(a),B=p(b);return "#"+A.map((v,i)=>Math.round(v+(B[i]-v)*t).toString(16).padStart(2,"0")).join("");}
let lastSky=-1;
let lastCc=-1;
function setSky(h,cc){
  if(Math.abs(h-lastSky)<.08 && Math.abs(cc-lastCc)<.04) return;
  lastSky=h; lastCc=cc;
  let k=0; while(k<SKY.length-2 && h>SKY[k+1][0]) k++;
  const t=(h-SKY[k][0])/(SKY[k+1][0]-SKY[k][0]);
  let top=mix(SKY[k][1],SKY[k+1][1],t), bot=mix(SKY[k][2],SKY[k+1][2],t);
  top=mix(top,"#7c838c",cc*.72); bot=mix(bot,"#aeb3b8",cc*.72);   // 흐릴수록 회색으로
  skyEl.style.background=`linear-gradient(${top} 0%, ${bot} 68%, ${mix(bot,"#2a2f28",.45)} 100%)`;
}

const track=document.getElementById("track"), tctx=track.getContext("2d");
function drawTrack(){
  const w=track.clientWidth||600,h=50,dpr=Math.min(devicePixelRatio||1,2);
  if(!w) return;
  track.width=w*dpr;track.height=h*dpr;tctx.setTransform(dpr,0,0,dpr,0,0);
  tctx.clearRect(0,0,w,h);
  const X=i=>i/(N-1)*w;
  tctx.fillStyle=cssv("--cool");tctx.globalAlpha=.3;
  for(let i=0;i<N;i++) if(D.mode[i]===1) tctx.fillRect(X(i),h-7,Math.max(1,w/N),7);
  tctx.globalAlpha=1;
  tctx.strokeStyle=cssv("--line");tctx.fillStyle=cssv("--muted");
  tctx.font='9px "IBM Plex Mono", monospace';tctx.textBaseline="top";
  for(let d=0;d<14;d++){
    const x=X(d*96);
    tctx.beginPath();tctx.moveTo(x+.5,0);tctx.lineTo(x+.5,h-8);tctx.stroke();
    const dd=new Date(T0.getTime()+d*86400000);
    if(w/14>28) tctx.fillText(`${dd.getMonth()+1}/${dd.getDate()}`,x+3,1);
  }
  tctx.beginPath();tctx.moveTo(0,h-8);
  for(let i=0;i<N;i++) tctx.lineTo(X(i),h-8-(D.pvs[i]/PV_MAX)*(h-20));
  tctx.lineTo(w,h-8);tctx.closePath();
  tctx.fillStyle=cssv("--pv");tctx.globalAlpha=.3;tctx.fill();tctx.globalAlpha=1;
  tctx.beginPath();
  for(let i=0;i<N;i++){const x=X(i),y=h-8-(D.gi[i]/GI_MAX)*(h-20);i?tctx.lineTo(x,y):tctx.moveTo(x,y);}
  tctx.strokeStyle=cssv("--grid-c");tctx.lineWidth=1;tctx.stroke();
  const px=X(pos);
  tctx.strokeStyle=cssv("--fg");tctx.lineWidth=1.5;
  tctx.beginPath();tctx.moveTo(px,0);tctx.lineTo(px,h);tctx.stroke();
  tctx.fillStyle=cssv("--fg");tctx.beginPath();tctx.arc(px,h-4,3.2,0,7);tctx.fill();
}

  pos=Math.max(0,Math.min(N-1,(cx-r.left)/r.width*(N-1)));}
track.addEventListener("pointerdown",e=>{scrub=true;seek(e.clientX);track.setPointerCapture(e.pointerId);});

// ================= 2D office room (chapter 2) =================
// 좁은 3D 실내로 기어들어가는 대신, 제어 챕터는 사무실 단면 그림으로 완전히 전환된다.
const roomC=document.getElementById("room"), rx=roomC.getContext("2d");
const hash=n=>{ const v=Math.sin(n*127.1)*43758.5453; return v-Math.floor(v); };
function rnd(c,x,y,ww,hh,r){
  c.beginPath(); c.moveTo(x+r,y); c.arcTo(x+ww,y,x+ww,y+hh,r);
  c.arcTo(x+ww,y+hh,x,y+hh,r); c.arcTo(x,y+hh,x,y,r); c.arcTo(x,y,x+ww,y,r); c.closePath();
}
function mixC(a,b,t){
  const q=s=>[1,3,5].map(i=>parseInt(s.slice(i,i+2),16));
  const A=q(a),B=q(b);
  return "#"+A.map((v,i)=>Math.round(v+(B[i]-v)*t).toString(16).padStart(2,"0")).join("");
}

function drawRoom(){
  const w=roomC.clientWidth, h=roomC.clientHeight, dpr=Math.min(devicePixelRatio||1,2);
  if(!w||!h) return;
  if(roomC.width!==w*dpr||roomC.height!==h*dpr){ roomC.width=w*dpr; roomC.height=h*dpr; }
  rx.setTransform(dpr,0,0,dpr,0,0); rx.clearRect(0,0,w,h);

  const t=S.date, hr=t.getHours()+t.getMinutes()/60;
  const day=hr>6.3&&hr<18.6, work=hr>=8&&hr<19.5;
  const CE=h*0.19, FL=h*0.78, RH=3.1;              // 실 높이 3.1 m
  const S_=(FL-CE)/RH, LEN=w/S_;                   // m → px, 화면에 들어오는 실 길이
  const mx=m=>m*S_;
  const span=(start,step)=>{ const a=[];
    for(let m=start;m<LEN-0.3;m+=step) a.push(m);
    if(!a.length) a.push(LEN/2); return a; };
  const SEATS=span(1.5,3.3), CASS=span(3.0,3.3), PLANTS=span(0.45,4.4);

  // ---- 창밖 ----
  const sky=rx.createLinearGradient(0,CE,0,FL);
  const clr=day?["#9cc4e4","#dae9f3"]:["#13203a","#243550"];
  const gry=day?["#9aa3ab","#c3c8cc"]:["#1b2230","#2b323d"];
  sky.addColorStop(0,mixC(clr[0],gry[0],S.cc));
  sky.addColorStop(1,mixC(clr[1],gry[1],S.cc));
  rx.fillStyle=sky; rx.fillRect(0,CE,w,FL-CE);
  if(day&&S.cc<0.72){
    const sx=mx(13.6), sy=CE+(FL-CE)*0.22, r0=S_*0.5, a=0.95-S.cc;
    const g=rx.createRadialGradient(sx,sy,0,sx,sy,r0*4);
    g.addColorStop(0,"rgba(255,246,214,"+a+")"); g.addColorStop(1,"rgba(255,246,214,0)");
    rx.fillStyle=g; rx.beginPath(); rx.arc(sx,sy,r0*4,0,7); rx.fill();
    rx.fillStyle="rgba(255,250,232,"+a+")";
    rx.beginPath(); rx.arc(sx,sy,r0,0,7); rx.fill();
  }
  rx.fillStyle=day?"rgba(140,152,163,"+(0.45+0.22*S.cc)+")":"rgba(58,68,84,.85)";
  const blocks=[];
  for(let i=0,m=-1.5;m<LEN+1.5;i++){
    const bw=0.9+hash(i)*1.6, bh=0.30+hash(i+5)*0.34;
    blocks.push([m,bw,bh]); m+=bw+0.25+hash(i+11)*0.5;
  }
  blocks.forEach(function(b){ const top=FL-(FL-CE)*b[2]; rx.fillRect(mx(b[0]),top,S_*b[1],FL-top); });
  if(!day){                                        // 맞은편 건물 창 불빛
    rx.fillStyle="rgba(255,222,150,.6)";
    blocks.forEach(function(b,bi){
      const top=FL-(FL-CE)*b[2], cols=Math.max(1,Math.round(b[1]/0.33));
      for(let c=0;c<cols;c++) for(let r=0;r<7;r++){
        if(hash(bi*31+c*7+r)>.46) continue;
        const wy=top+(FL-top)*(0.10+r*0.13);
        if(wy>FL-4) continue;
        rx.fillRect(mx(b[0])+S_*(0.1+c*0.33),wy,S_*0.14,S_*0.1);
      }
    });
  }

  // ---- 커튼월 ----
  rx.strokeStyle="rgba(236,239,241,.92)"; rx.lineWidth=Math.max(2,S_*0.07);
  for(let m=0;m<=LEN+1.5;m+=1.5){ rx.beginPath(); rx.moveTo(mx(m),CE); rx.lineTo(mx(m),FL); rx.stroke(); }
  [0.30,0.72].forEach(function(f){ const y=CE+(FL-CE)*f;
    rx.beginPath(); rx.moveTo(0,y); rx.lineTo(w,y); rx.stroke(); });
  rx.fillStyle="rgba(255,255,255,.10)"; rx.fillRect(0,CE,w,FL-CE);

  // ---- 바닥 / 천장 ----
  const fg=rx.createLinearGradient(0,FL,0,h);
  fg.addColorStop(0,"#b9bdc1"); fg.addColorStop(1,"#d3d6d9");
  rx.fillStyle=fg; rx.fillRect(0,FL,w,h-FL);
  rx.fillStyle="#9fa4a9"; rx.fillRect(0,FL,w,Math.max(1.5,S_*0.03));
  const sh=rx.createLinearGradient(0,FL,0,FL+S_*0.5);
  sh.addColorStop(0,"rgba(40,48,58,.22)"); sh.addColorStop(1,"rgba(40,48,58,0)");
  rx.fillStyle=sh; rx.fillRect(0,FL,w,S_*0.5);
  rx.fillStyle="#e9ecee"; rx.fillRect(0,0,w,CE);
  rx.fillStyle="#d2d6d9"; rx.fillRect(0,CE-Math.max(1.5,S_*0.03),w,Math.max(1.5,S_*0.03));

  // ---- 라인 조명 ----
  const litF=work?1:(day?.35:.12);
  CASS.concat(CASS.map(function(c){return c+1.65;})).forEach(function(lz){
    const lx=mx(lz), ly=CE+S_*0.05, lw=S_*1.4, lh=Math.max(3,S_*0.07);
    rx.fillStyle="rgba(255,247,226,"+(0.25+0.7*litF)+")";
    rx.fillRect(lx-lw/2,ly,lw,lh);
    const gl=rx.createLinearGradient(0,ly,0,ly+S_*0.9);
    gl.addColorStop(0,"rgba(255,246,214,"+(0.22*litF)+")");
    gl.addColorStop(1,"rgba(255,246,214,0)");
    rx.fillStyle=gl; rx.fillRect(lx-lw,ly+lh,lw*2,S_*0.9);
  });

  // ---- 천장 카세트 + 급기 ----
  const cool=S.mode===1, heat=S.mode===2, pcf=PC_MAX?S.pc/PC_MAX:0;
  const on=cool||heat, col=cool?"110,185,240":"242,150,110";
  CASS.forEach(function(cz,i){
    const cxp=mx(cz), cw=S_*1.55, chh=Math.max(7,S_*0.3);
    rx.fillStyle="#f7f9fa"; rnd(rx,cxp-cw/2,CE,cw,chh,3); rx.fill();
    rx.strokeStyle="rgba(120,132,142,.45)"; rx.lineWidth=1;
    rnd(rx,cxp-cw/2,CE,cw,chh,3); rx.stroke();
    rx.fillStyle="#aeb8c0"; rnd(rx,cxp-cw*0.26,CE+chh*0.40,cw*0.52,chh*0.42,2); rx.fill();
    // 좌우 토출 루버 — 운전 중에는 각도가 흔들린다
    const sw=on?Math.sin(animT*0.0016+i)*0.22:0;
    [-1,1].forEach(function(sd){
      rx.save(); rx.translate(cxp+sd*cw*0.40,CE+chh*0.78); rx.rotate(sd*(0.5+sw));
      rx.fillStyle=on?"#dfe8ee":"#c9d0d6";
      rnd(rx,-cw*0.11,-chh*0.08,cw*0.22,chh*0.16,1.5); rx.fill(); rx.restore();
    });
    // 운전 표시등
    rx.fillStyle=on?"rgba("+col+",1)":"rgba(150,158,166,.6)";
    rx.beginPath(); rx.arc(cxp+cw*0.5-S_*0.07,CE+chh*0.5,Math.max(2,S_*0.028),0,7); rx.fill();
    if(on){
      rx.fillStyle="rgba("+col+","+(0.18+0.12*Math.sin(animT*0.005))+")";
      rx.beginPath(); rx.arc(cxp+cw*0.5-S_*0.07,CE+chh*0.5,Math.max(5,S_*0.075),0,7); rx.fill();
    }
    if(!on||pcf<.02) return;
    // 토출 기류 — 원뿔형으로 퍼지며 바닥 가까이에서 옆으로 번진다
    const cg=rx.createLinearGradient(0,CE+chh,0,FL);
    cg.addColorStop(0,"rgba("+col+","+(0.16+0.22*pcf)+")");
    cg.addColorStop(1,"rgba("+col+",0)");
    rx.fillStyle=cg;
    rx.beginPath(); rx.moveTo(cxp-cw*0.4,CE+chh); rx.lineTo(cxp+cw*0.4,CE+chh);
    rx.lineTo(cxp+S_*2.0,FL); rx.lineTo(cxp-S_*2.0,FL); rx.closePath(); rx.fill();
    for(let k=0;k<26;k++){
      const ph=((animT*0.00018*(0.5+pcf))+k/26+i*0.13)%1, sd=k%2?1:-1;
      const px=cxp+sd*(S_*0.2+ph*ph*S_*2.0), py=CE+chh+ph*(FL-CE-chh)*0.97;
      rx.strokeStyle="rgba("+col+","+Math.max(0,(1-ph*0.85)*0.5*(0.3+pcf))+")";
      rx.lineWidth=Math.max(1.3,S_*0.03); rx.lineCap="round";
      rx.beginPath(); rx.moveTo(px,py); rx.lineTo(px+sd*S_*0.09,py+S_*0.19); rx.stroke();
    }
  });

  // ---- 사람과 책상 ----
  const occ = work?1:((hr>=6&&hr<22)?0.3:0);
  SEATS.forEach(function(sz,i){
    drawStation(mx(sz),FL,S_,i, occ>0 && hash(i+2)<occ+0.25, work);
  });
  if(work) for(let k=0;k<2;k++){
    const per=52000+k*23000, ph=((animT+k*31000)%per)/per, tri=ph<.5?ph*2:(1-ph)*2;
    drawWalker(mx(0.8+tri*Math.max(1,LEN-1.6)),FL,S_,ph<.5?1:-1,k);
  }
  PLANTS.forEach(function(pz,i){ drawPlant(mx(pz),FL,S_,i); });

  // ---- 실내 공기 온도 틴트 ----
  const dev=S.rt<S.cl?(S.rt-S.cl):(S.rt>S.ch?S.rt-S.ch:0);
  if(Math.abs(dev)>0.05){
    rx.fillStyle = dev<0 ? "rgba(90,150,210,"+Math.min(.16,-dev*.1)+")"
                         : "rgba(214,130,70,"+Math.min(.16,dev*.1)+")";
    rx.fillRect(0,CE,w,FL-CE);
  }
  if(!day){ rx.fillStyle="rgba(12,18,30,"+(work?0.12:0.34)+")"; rx.fillRect(0,0,w,h); }
  drawComfort(w,h);
}

const SKIN =["#f2d5b8","#e6bd99","#d7a881","#c2916c"];
const HAIR =["#2a2420","#3b2f27","#1d1a18","#584334"];
const SHIRT=["#ffffff","#cfd9e4","#9fb3c8","#4b6381","#7d8a6f","#c3c7cb"];
const PANTS=["#39414d","#2b323c","#4a5260","#54504a"];

// 한 자리: 의자 → 사람 → 책상 → 책상 위 물건 순으로 겹친다
function drawStation(x,y,s,seed,occupied,work){
  const px=x-s*0.75;
  drawChair(px,y,s,seed);
  if(occupied) drawSeated(px,y,s,seed,work);
  // 책상
  rx.fillStyle="rgba(40,48,58,.13)";
  rx.beginPath(); rx.ellipse(x,y+s*0.02,s*1.0,s*0.06,0,0,7); rx.fill();
  rx.fillStyle="#8e949b";
  rx.fillRect(x-s*0.86,y-s*0.72,s*0.045,s*0.72);
  rx.fillRect(x+s*0.82,y-s*0.72,s*0.045,s*0.72);

// 전 구간을 한 번 집계해 두고 매 프레임 그리기만 한다.
const resC=document.getElementById("results"), gx=resC.getContext("2d");
const R=(function(){
  const q=0.25, day=[], err=[];
  let Epv=0,Eld=0,Egi=0,Epc=0,Ecost=0,cool=0;
  const byReg={clear:[],mid:[],cloud:[]};
  const work=[], night=[];
  for(let i=0;i<N;i++){
    Epv+=D.pvs[i]*q; Eld+=D.ld[i]*q; Egi+=D.gi[i]*q; Epc+=D.pc[i]*q; Ecost+=D.cost[i]*q;
    if(D.mode[i]===1) cool++;
    if(D.fc[i]>1||D.meas[i]>1){
      const e=D.meas[i]-D.fc[i]; day.push(i); err.push(e);
      (D.cc[i]<.35?byReg.clear:D.cc[i]<.7?byReg.mid:byReg.cloud).push(e);
    }
    const hh=Math.floor(i*STEP/60)%24;
    (hh>=8&&hh<20?work:night).push(i);
  }
  const mean=a=>a.reduce((x,y)=>x+y,0)/(a.length||1);
  const mae=mean(err.map(Math.abs)), rmse=Math.sqrt(mean(err.map(e=>e*e)));
  const mu=mean(day.map(i=>D.meas[i]));
  const r2=1-err.reduce((s,e)=>s+e*e,0)/day.reduce((s,i)=>s+Math.pow(D.meas[i]-mu,2),0);
  const cap=Math.max(MX("fc"),MX("meas"));
  const viol=g=>g.filter(i=>D.rt[i]>D.ch[i]+.05||D.rt[i]<D.cl[i]-.05).length;
  const exc=g=>mean(g.map(i=>Math.max(0,D.rt[i]-D.ch[i],D.cl[i]-D.rt[i])));
  return {day,err,mae,rmse,bias:mean(err),r2,cap,
    nmae:mae/cap*100, nrmse:rmse/cap*100,
    reg:[["맑음",byReg.clear],["보통",byReg.mid],["흐림",byReg.cloud]]
         .map(r=>({k:r[0],n:r[1].length,mae:mean(r[1].map(Math.abs)),bias:mean(r[1])})),
    Epv,Eld,Egi,Epc,Ecost,cool,
    self:(Eld-Egi)/Epv*100, auto:(Eld-Egi)/Eld*100,
    pvCool:(function(){let c=0;for(let i=0;i<N;i++) if(D.mode[i]===1&&D.pvs[i]>10)c++;return c;})(),
    coolPrice:(function(){let a=0,b=0;for(let i=0;i<N;i++) if(D.mode[i]===1){a+=D.pr[i]*D.pc[i];b+=D.pc[i];}
                return b?a/b:0;})(),
    avgPrice:mean(D.pr.slice(0,N)),
    work:{n:work.length,v:viol(work),e:exc(work)},
    night:{n:night.length,v:viol(night),e:exc(night)},
    days:(function(){const a=[];for(let d=0;d<14;d++){
      let pv=0,gi=0,c=0,pc=0;
      for(let k=d*96;k<(d+1)*96&&k<N;k++){pv+=D.pvs[k]*q;gi+=D.gi[k]*q;c+=D.cost[k]*q;pc+=D.pc[k]*q;}
      a.push({pv,gi,c,pc,cc:D.cc[d*96+48]});} return a;})()
  };
})();

    // KPI 네 개

  function wrap(text,x,y,maxw,lh){
    const words=text.split(" "); let line="", yy=y;
    words.forEach(function(wd){
      const t=line?line+" "+wd:wd;
      if(gx.measureText(t).width>maxw && line){ gx.fillText(line,x,yy); line=wd; yy+=lh; }
      else line=t;
    });
    if(line) gx.fillText(line,x,yy);
  }
}

// ================= forecast chart =================
const fcC=document.getElementById("fcChart"), fx=fcC.getContext("2d");
const PAST_N=12;                              // 과거 3시간
const YMAX=Math.ceil(Math.max(PANEL_MAX,HZ_MAX)/10)*10;
function drawChart(){
  const w=fcC.clientWidth, h=188, dpr=Math.min(devicePixelRatio||1,2);
  if(!w) return;
  fcC.width=w*dpr; fcC.height=h*dpr; fx.setTransform(dpr,0,0,dpr,0,0);
  fx.clearRect(0,0,w,h);
  const L=38, R=8, T=10, B=20, pw=w-L-R, phh=h-T-B;
  const i=S.i, span=PAST_N+HZ;                       // 3시간 과거 + 6시간 예측
  const X=k=>L+(k/span)*pw;                          // k=0 → i-PAST_N
  const Y=v=>T+phh-(Math.min(v,YMAX)/YMAX)*phh;
  const line=cssv("--line"), muted=cssv("--muted"), fg=cssv("--fg"), pv=cssv("--pv");

  // 눈금
  fx.strokeStyle=line; fx.fillStyle=muted; fx.lineWidth=1;
  fx.font='9px "IBM Plex Mono", monospace'; fx.textAlign="right"; fx.textBaseline="middle";
  for(let g=0;g<=4;g++){
    const v=YMAX*g/4, y=Y(v);
    fx.beginPath(); fx.moveTo(L,y+.5); fx.lineTo(w-R,y+.5); fx.stroke();
    fx.fillText(v.toFixed(0), L-6, y);
  }

  // 시각 눈금 (정시마다)
  fx.textAlign="center"; fx.textBaseline="top";
  for(let k=0;k<=span;k++){
    const idx=i-PAST_N+k;
    if(idx<0||idx>=N) continue;
    const d=new Date(T0.getTime()+idx*STEP*60000);
    if(d.getMinutes()!==0 || d.getHours()%2) continue;
    fx.strokeStyle=line; fx.beginPath();
    fx.moveTo(X(k)+.5,T); fx.lineTo(X(k)+.5,T+phh); fx.stroke();
    fx.fillStyle=muted; fx.fillText(String(d.getHours()).padStart(2,"0"), X(k), T+phh+4);
  }

  // 갱신되기 전 예측들 — 호라이즌이 밀리는 모습
  [8,4].forEach((back,n)=>{
    const row=D.hz[Math.max(0,i-back)]; if(!row) return;
    fx.strokeStyle=pv; fx.globalAlpha=.20+n*.12; fx.lineWidth=1;
    fx.beginPath();
    for(let k=0;k<HZ;k++){
      const xk=PAST_N-back+1+k; if(xk<0) continue;
      const x=X(xk), y=Y(row[k]/10);
      xk===Math.max(0,back-PAST_N-1)||k===0?fx.moveTo(x,y):fx.lineTo(x,y);
    }
    fx.stroke(); fx.globalAlpha=1;
  });

  // 현재 예측 (면적 + 선)
  const cur=D.hz[i]||[];
  fx.beginPath(); fx.moveTo(X(PAST_N),Y(0));
  for(let k=0;k<HZ;k++) fx.lineTo(X(PAST_N+k),Y(cur[k]/10));
  fx.lineTo(X(PAST_N+HZ-1),Y(0)); fx.closePath();
  fx.fillStyle=pv; fx.globalAlpha=.16; fx.fill(); fx.globalAlpha=1;
  fx.beginPath();
  for(let k=0;k<HZ;k++){ const x=X(PAST_N+k),y=Y(cur[k]/10); k?fx.lineTo(x,y):fx.moveTo(x,y); }
  fx.strokeStyle=pv; fx.lineWidth=1.8; fx.stroke();

  // 실측 (과거)
  fx.beginPath();
  for(let k=0;k<=PAST_N;k++){
    const idx=i-PAST_N+k; if(idx<0) continue;
    const x=X(k), y=Y(D.meas[idx]);
    k?fx.lineTo(x,y):fx.moveTo(x,y);
  }
  fx.strokeStyle=fg; fx.lineWidth=1.6; fx.stroke();

  // now
  fx.strokeStyle=fg; fx.globalAlpha=.55; fx.setLineDash([3,3]); fx.lineWidth=1;
  fx.beginPath(); fx.moveTo(X(PAST_N),T); fx.lineTo(X(PAST_N),T+phh); fx.stroke();
  fx.setLineDash([]); fx.globalAlpha=1;
  fx.fillStyle=fg; fx.textAlign="left"; fx.textBaseline="top";
  fx.fillText("now", X(PAST_N)+4, T+1);
  fx.fillStyle=muted; fx.textAlign="right";
  fx.fillText("+6h", w-R-2, T+1);
}

  $("mPc").innerHTML=U(S.pc,1,"kW");

  $("mRtSub").textContent=`외기 ${nf(S.at,1)}°C`+(S.rtm!=null?` · 센서 ${nf(S.rtm,1)}°C`:"");

  $("wx").textContent=`${sky} · 구름 ${Math.round(S.cc*100)}% · 일사 ${nf(S.sghi,0)} W/m²`;
  $("mCost").innerHTML=U(Math.round(S.cost),0,"원");
  $("mCostSub").textContent=`${S.i===0?0:Math.round(S.cost/(S.i/96+1e-4)).toLocaleString("ko-KR")} 원/일`;

  const lo=20,hi=28,pc=v=>Math.max(0,Math.min(100,(v-lo)/(hi-lo)*100));

  $("bandOk").style.width=Math.max(1,pc(S.ch)-pc(S.cl))+"%";
  $("bandDot").style.left=`calc(${pc(S.rt)}% - 1px)`;
  $("bandDot").style.background=(S.rt<S.cl-.1||S.rt>S.ch+.1)?cssv("--warn"):cssv("--fg");

  $("fcV").textContent=nf(S.fc,1)+" W";

    : `오차 ${e>=0?"+":""}${nf(e,1)} W · 일사량 ${nf(S.sghi,0)} W/m² · 구름량 ${Math.round(S.cc*100)}%`;

const vP=new THREE.Vector3();
function placeTags(){
  const w=app.clientWidth,h=app.clientHeight;
  tags.forEach(t=>{
    if(!t.ch.includes(chap)){ t.el.hidden=true; return; }
    vP.copy(t.at).project(camera);
    const x=(vP.x*.5+.5)*w, y=(-vP.y*.5+.5)*h;
    const vis=vP.z<1&&x>10&&x<w-10&&y>10&&y<h-72;   // 화면 밖으로 잘리는 라벨은 숨김
    t.el.hidden=!vis; if(!vis) return;
    t.el.style.left=x+"px"; t.el.style.top=y+"px";
    t.el.textContent=t.f();

// ================= binding =================
const cCold=new THREE.Color(0x3f7fc4),cOk=new THREE.Color(0x49a583),cHot=new THREE.Color(0xd4793a);
const tc=new THREE.Color();
function updateScene(dt){
  const hr=S.date.getHours()+S.date.getMinutes()/60;
  const a=(hr-6)/12*Math.PI, up=Math.sin(a), day=up>0;
  const cc=S.cc;                                  // 0 맑음 → 1 완전 흐림
  setSky(hr,cc);
  sun.position.set(Math.cos(a)*60,Math.max(2,up*48),22);
  sunBall.position.copy(sun.position).multiplyScalar(.9);
  sunBall.material.color.set(day?0xffe9b0:0xbfc8d8);
  sunBall.material.transparent=true;
  sunBall.material.opacity=Math.max(0,1-cc*1.35);
  sunBall.scale.setScalar(day?1:.5);
  sun.intensity=(day?.30+up*1.25:.04)*(1-.80*cc);  // 흐릴수록 직달광이 줄고
  sun.castShadow=cc<.75;                          //   그림자도 사라진다
  hemi.intensity=(day?.10+up*.46:.07)*(1+.40*cc);  //   대신 확산광이 늘어난다
  fillL.intensity=(day?.05+up*.16:.04)*(1+.5*cc);
  officeLights.forEach(L=>{ L.intensity=(chap===2?0.40:0.18)*(day?0.70:1.20); });
  clouds.forEach(c=>{
    c.th+=c.sp*dt*.02;
    c.m.position.x+=Math.cos(c.th)*dt*.0018;
    c.m.position.z+=Math.sin(c.th)*dt*.0018;
    c.m.material.opacity=Math.min(.82,Math.max(0,(cc-.12)*1.15))*(day?1:.4);
    c.m.material.color.setScalar(day?1-.26*cc:.5);
  });

  const dev=S.rt<S.cl?(S.rt-S.cl):(S.rt>S.ch?S.rt-S.ch:0);
  tc.copy(cOk);
  if(dev<0) tc.lerp(cCold,Math.min(1,-dev/1.5)); else if(dev>0) tc.lerp(cHot,Math.min(1,dev/1.5));
  const lit=day?.06:.3;
  roomMats.forEach((m,k)=>{
    m.color.copy(tc).lerp(new THREE.Color(0x8a9bb0),.4);
    m.emissive.copy(tc).multiplyScalar(lit+(S.mode===1?.12:0));
    m.opacity=(chap===2&&k===2)?.07:.24;        // 들어가 있는 층은 거의 투명하게
  });

  const pf=PV_MAX?S.pv/PV_MAX:0, curt=S.cur>.05;
  pvMats.forEach(m=>{
    m.color.setRGB(.050+pf*.055,.075+pf*.095,.135+pf*.150);
    m.emissive.setRGB(curt?pf*.26:0, pf*.055, pf*.115);
  });

  const run=S.mode===1||S.mode===2, cf=PC_MAX?S.pc/PC_MAX:0;
  ehp.forEach(u=>{
    u.body.color.set(run?0xb4bcc5:0x8d949c);
    if(run&&!reduced) u.fan.rotation.z+=dt*(.004+cf*.022);
  });
  supply.forEach(s=>{
    const p=s.geo.attributes.position.array;
    for(let k=0;k<s.cnt;k++){
      let v=(s.t[k]+dt*(.00014+cf*.00070))%1; if(!(v>=0)) v=0; s.t[k]=v;
      const uz=UNIT_Z[k%3];
      p[k*3]=16.9-v*3.0;                       // 실내기에서 중정 쪽으로
      p[k*3+1]=s.y-v*(FH-1.3);                 // 아래로 하강
      p[k*3+2]=uz+(v-.5)*3.4;
    }
    s.geo.attributes.position.needsUpdate=true;
    s.mat.opacity=(S.mode===1?Math.min(.8,.12+cf*1.1):0)*(chap===2?1:.45);
    s.mat.color.set(S.mode===2?0xf08a6e:0x5fb3ea);
  });

  stepFlow(flowPv,PV_MAX?S.pv/PV_MAX:0,dt);
  stepFlow(flowGi,GI_MAX?S.gi/GI_MAX:0,dt);
}

// ================= loop =================
let pos=3*96+48, rate=60, playing=true, last=performance.now(), animT=0;  // 10/02 12:00 (구름 0.29, 가장 맑은 날)
function frame(now){
  const dt=Math.max(0,Math.min(120,now-last)); last=now; animT=now;
  if(playing&&!scrub){ pos+=(rate*dt/1000)/STEP; if(pos>=N-1) pos=0; }
  sample(pos);
  if(spin){ tgt.th+=dt*0.000022; }
  placeCam(dt);
  updateScene(dt); updateHUD();
  if(chap!==2 || now-chapAt<700) renderer.render(scene,camera);   // 전환 동안만 둘 다 그린다
  if(chap===2) drawRoom();
  if(chap===4) drawResults();
  placeTags(); drawTrack();
  requestAnimationFrame(frame);
}

  rate=+b.dataset.rate;
  document.querySelectorAll(".sp").forEach(x=>x.setAttribute("aria-pressed",x===b?"true":"false"));}));
document.querySelectorAll("#chapters button").forEach(b=>
  b.addEventListener("click",()=>setChapter(+b.dataset.ch)));
addEventListener("keydown",e=>{
  if(e.key===" "){e.preventDefault();$("play").click();}
  if(e.key==="ArrowRight") pos=Math.min(N-1,pos+4);
  if(e.key==="ArrowLeft")  pos=Math.max(0,pos-4);
  if("1234".includes(e.key)) setChapter(+e.key);
});

setChapter(1); applyTheme(); resize(); sample(pos); updateHUD();
requestAnimationFrame(frame);
})();
</script>
