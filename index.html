<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>P2H-EMS 감시제어</title>
<link rel="stylesheet" href="css/app.css">
</head>
<body data-view="1">

<header id="hdr">
  <h1>P2H-EMS 감시제어<small>충남대학교 공학 2호관</small></h1>
  <div class="lamps">
    <span class="lamp">기상 수집</span>
    <span class="lamp">발전 예측</span>
    <span class="lamp">MPC</span>
    <span class="lamp off" id="lamp-ehp">EHP 정지</span>
  </div>
  <div class="clock"><span id="hdr-date">2026-10-02</span><span id="hdr-time">12:00:00</span></div>
  <div id="hdr-speed">기록 재생 1시간/초</div>
</header>

<nav id="left" class="pn" aria-label="화면">
  <div class="ph">화면</div>
  <div id="menu">
    <button type="button" data-view="1" aria-current="true"><kbd>1</kbd>발전 예측</button>
    <button type="button" data-view="2"><kbd>2</kbd>실내 제어</button>
    <button type="button" data-view="3"><kbd>3</kbd>알고리즘</button>
    <button type="button" data-view="4"><kbd>4</kbd>실험 결과</button>
  </div>
  <div id="cycle-wrap">
    <div class="ph">15분 제어 주기<span>도식</span></div>
    <ol id="cycle">
      <li>기상 수집</li><li>발전량 예측</li><li>MPC 최적화</li><li>첫 입력 적용</li><li>EHP 운전</li>
    </ol>
  </div>
</nav>

<main id="center">
  <div id="summary">기록을 불러오는 중입니다.</div>
  <div id="view"></div>
</main>

<aside id="right">
  <div class="pn"><div class="ph">계측값<span>15분 갱신</span></div><table id="meas"></table></div>
  <div class="pn"><div class="ph">이벤트<span>최근 순</span></div><ul id="events"></ul></div>
</aside>

<footer id="ftr">
  <button type="button" id="btn-play">일시정지</button>
  <canvas id="timeline"></canvas>
  <span>9/29 – 10/12</span>
</footer>

<div id="narrow"><b>화면을 넓혀 주세요</b>이 화면은 가로 1280px 이상에서 볼 수 있습니다.</div>

<script src="vendor/three.min.js"></script>
<script src="data/zeb_window.js"></script>
<script src="js/data.js"></script>
<script src="js/chart.js"></script>
<script src="js/scene-exterior.js"></script>
<script src="js/scene-room.js"></script>
<script src="js/shell.js"></script>
<script src="js/view-forecast.js"></script>
<script src="js/view-room.js"></script>
<script src="js/view-algo.js"></script>
<script src="js/view-results.js"></script>
<script>ZEB.shell.start();</script>
</body>
</html>
